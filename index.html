<script>
// ?perf: time each animation frame's work (Go update + draw + WebGL calls)
if (/[?&]perf\b/.test(location.search)) {
  const raf = window.requestAnimationFrame.bind(window), d = [], gap = [];
  let last = 0;
  window.__perf = { d, gap, stat() {
    const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(2); };
    return { n: d.length, med: q(d, 0.5), p95: q(d, 0.95), max: q(d, 1), gapMed: q(gap, 0.5), gapP95: q(gap, 0.95) };
  }, reset() { d.length = 0; gap.length = 0; } };
  window.requestAnimationFrame = cb => raf(t => {
    if (last) gap.push(t - last);
    last = t;
    const s = performance.now();
    cb(t);
    d.push(performance.now() - s);
    if (d.length > 1200) { d.shift(); gap.shift(); }
  });
  // ?perf&play=FILE: a scripted play (see bench_js.go); every 5 s a row of
  // how far gone the screen is and how the frames went goes to __series
  if (/[?&]play=/.test(location.search)) {
    const series = window.__series = [], t0 = performance.now();
    setInterval(() => {
      if (typeof __wstat !== "function" || !d.length) return;
      const s = JSON.parse(__wstat()), w = JSON.parse(__wprof()), p = __perf.stat();
      series.push({ off: window.__offNow || "", wall: Math.round((performance.now() - t0) / 1000), game: +s.t.toFixed(1), d: +s.d.toFixed(3), phase: s.phase,
        pieces: s.pieces || 0, letters: s.letters || 0, fps: +(p.n / 5).toFixed(1), gapMed: p.gapMed, gapP95: p.gapP95,
        work: p.med, workP95: p.p95, ticks: +(w.frames / Math.max(1, p.n)).toFixed(2),
        top: w.rows.filter(r => r.avg >= 0.3).slice(0, 8).map(r => r.name + " " + r.avg).join(", ") });
      __perf.reset();
      // &cycle=a|b,c|d: past D 0.8 leave those parts of the frame out by
      // turns, a row each, to see what each costs here
      const cyc = new URLSearchParams(location.search).get("cycle");
      if (cyc && s.d >= 0.8 && s.phase == 0) {
        const sets = [""].concat(cyc.split("|"));
        window.__cyc = ((window.__cyc ?? -1) + 1) % sets.length;
        __woff(window.__offNow = sets[window.__cyc]);
      }
    }, 5000);
  }
}
</script>
<script>window.__wasm = {"br": 5029562, "gz": 6266726, "raw": 25762188};</script>
<script src="wasm_exec.js"></script>
<script>
(async () => {
  const go = new Go();
  const prog = document.getElementById("prog");
  // the dev server (cmd/serve) compresses main.wasm on the fly and says how
  // long it is; a static host (GitHub Pages, tools/pages) serves the
  // precompressed files as they are, listed in window.__wasm with their sizes,
  // and the browser inflates them
  const W = window.__wasm;
  const can = f => { try { new DecompressionStream(f); return true; } catch (e) { return false; } };
  const pick = () => {
    if (!W || !window.TransformStream) return { url: "main.wasm" };
    if (W.br && can("brotli")) return { url: "main.wasm.br", size: W.br, inflate: "brotli" };
    if (W.gz && can("gzip")) return { url: "main.wasm.gz", size: W.gz, inflate: "gzip" };
    return { url: "main.wasm", size: W.raw };
  };
  try {
    const src = pick();
    const res = await fetch(src.url);
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const total = src.size || +res.headers.get("x-raw-length") || 0;
    let r;
    if (res.body && WebAssembly.instantiateStreaming && window.TransformStream) {
      // compile while it downloads, counting the bytes for the bar
      let got = 0;
      let body = res.body.pipeThrough(new TransformStream({ transform(chunk, ctl) {
        got += chunk.length;
        if (total) prog.style.width = Math.min(100, got / total * 100) + "%";
        ctl.enqueue(chunk);
      } }));
      if (src.inflate) body = body.pipeThrough(new DecompressionStream(src.inflate));
      r = await WebAssembly.instantiateStreaming(
        new Response(body, { headers: { "Content-Type": "application/wasm" } }), go.importObject);
    } else {
      const raw = src.inflate ? new Response(res.body.pipeThrough(new DecompressionStream(src.inflate))) : res;
      r = await WebAssembly.instantiate(await raw.arrayBuffer(), go.importObject);
    }
    document.getElementById("loading").remove();
    go.run(r.instance);
  } catch (e) {
    document.querySelector("#loading div").textContent = "読み込みに失敗しました: " + e;
  }
})();
</script>
